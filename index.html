<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f8fa;
  color:#16324a;
}

.header{
  background:linear-gradient(135deg,#08a7a7,#1677c8);
  color:white;
  padding:28px 20px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:7px 0 0;
  font-size:17px;
}

.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:24px;
  border-radius:18px;
  margin-top:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

input{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:1px solid #d5dfe5;
  border-radius:11px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:11px;
  background:#08a7a7;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.link-button{
  background:transparent;
  color:#1677c8;
}

.logout{
  background:#1677c8;
}

.error{
  color:#c62828;
  margin-top:12px;
  font-weight:bold;
}

.success{
  color:#158447;
  margin-top:12px;
  font-weight:bold;
}

.status{
  display:inline-block;
  background:#dff7ea;
  color:#158447;
  padding:8px 13px;
  border-radius:20px;
  font-weight:bold;
}

.task{
  border-left:4px solid #08a7a7;
  padding:14px;
  margin-top:15px;
  background:#f7fafb;
  border-radius:9px;
}

.task h3{
  margin:0 0 9px;
}

.admin-badge{
  display:inline-block;
  background:#e6f2ff;
  color:#1677c8;
  padding:8px 13px;
  border-radius:20px;
  font-weight:bold;
}

.admin-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.admin-item{
  background:#f7fafb;
  border-radius:14px;
  padding:18px 10px;
  text-align:center;
  border:1px solid #e4ecef;
  cursor:pointer;
}

.admin-icon{
  font-size:28px;
  margin-bottom:8px;
}

.admin-item strong{
  display:block;
  font-size:15px;
}

.admin-item small{
  display:block;
  margin-top:5px;
  color:#667b8c;
}

#employeeDashboard,
#adminDashboard,
#resetPassword,
#employeesPage{
  display:none;
}
</style>
</head>

<body>

<div class="header">
  <h1>H CLEANING SERVICES</h1>
  <p id="areaTitle">Espace Employé</p>
</div>
