<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>H Cleaning Services - Espace Employé</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
  margin:0;
  background:#f4f8fa;
  color:#16324a;
}

.header{
  background:linear-gradient(135deg,#08a7a7,#1677c8);
  color:white;
  padding:25px 20px;
  text-align:center;
}

.header h1{margin:0;font-size:24px}
.header p{margin:6px 0 0}

.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:22px;
  border-radius:16px;
  margin-top:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

input{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:1px solid #d5dfe5;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:#08a7a7;
  color:white;
  font-size:16px;
  font-weight:bold;
}

button:disabled{opacity:.6}

.logout{background:#1677c8}

.link-button{
  background:none;
  color:#1677c8;
  padding:8px;
}

.error{
  color:#c62828;
  margin-top:12px;
}

.success{
  color:#158447;
  margin-top:12px;
}

.status{
  display:inline-block;
  background:#dff7ea;
  color:#158447;
  padding:8px 13px;
  border-radius:20px;
  font-weight:bold;
}

.task{
  border-left:4px solid #08a7a7;
  padding:12px 15px;
  margin-top:15px;
  background:#f7fafb;
  border-radius:8px;
}

.task h3{margin:0 0 8px}

#dashboard,
#resetPassword{
  display:none;
}
</style>
</head>

<body>

<div class="header">
  <h1>H CLEANING SERVICES</h1>
  <p>Espace Employé</p>
</div>

<div class="container">

  <!-- LOGIN -->
  <div id="login" class="card">
    <h2>Connexion</h2>

    <input id="email"
           type="email"
           placeholder="Adresse e-mail"
           autocomplete="email">

    <input id="password"
           type="password"
           placeholder="Mot de passe"
           autocomplete="current-password">

    <button id="loginButton" onclick="login()">
      Se connecter
    </button>

    <button class="link-button" onclick="forgotPassword()">
      Mot de passe oublié ?
    </button>

    <div id="error" class="error"></div>
    <div id="message" class="success"></div>
  </div>


  <!-- NEW PASSWORD -->
  <div id="resetPassword" class="card">

    <h2>Nouveau mot de passe</h2>

    <p>Choisissez votre nouveau mot de passe.</p>

    <input id="newPassword"
           type="password"
           placeholder="Nouveau mot de passe">

    <input id="confirmPassword"
           type="password"
           placeholder="Confirmer le mot de passe">

    <button onclick="saveNewPassword()">
      Enregistrer le nouveau mot de passe
    </button>

    <div id="resetError" class="error"></div>
    <div id="resetMessage" class="success"></div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard">

    <div class="card">
      <h2 id="welcome">Bonjour 👋</h2>
      <p>Voici votre planning de la journée.</p>
      <span class="status">● Disponible</span>
    </div>

    <div class="card">

      <h2>Mes tâches</h2>

      <div class="task">
        <h3>Bureau Client</h3>
        <div>🕗 08:00 – 10:00</div>
        <div>📍 Verviers</div>
        <button>Voir la tâche</button>
      </div>

      <div class="task">
        <h3>Nettoyage habitation</h3>
        <div>🕚 11:00 – 13:00</div>
        <div>📍 Eupen</div>
        <button>Voir la tâche</button>
      </div>

      <button class="logout" onclick="logout()">
        Se déconnecter
      </button>

    </div>
  </div>

</div>


<script>

const SUPABASE_URL =
"https://lexymobulxbkseefxxmxe.supabase.co";

const SUPABASE_ANON_KEY =
const SUPABASE_ANON_KEY =
"sb_publishable_WE_xrJP3u21brM2YKUxeEg_JpUeFuC4";


const APP_URL =
"https://hcleaningservices.github.io/hcleaningservices-app/";

const supabaseClient =
supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);


/* LOGIN */

async function login(){

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  const errorBox =
  document.getElementById("error");

  errorBox.textContent="";

  const {data,error} =
  await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    errorBox.textContent =
    "E-mail ou mot de passe incorrect.";
    return;
  }

  await showDashboard(data.user);
}


/* FORGOT PASSWORD */

async function forgotPassword(){

  const email =
  document.getElementById("email").value.trim();

  const errorBox =
  document.getElementById("error");

  const message =
  document.getElementById("message");

  errorBox.textContent="";
  message.textContent="";

  if(!email){
    errorBox.textContent =
    "Entrez d'abord votre adresse e-mail.";
    return;
  }

  const {error} =
  await supabaseClient.auth.resetPasswordForEmail(
    email,
    {redirectTo:APP_URL}
  );

  if(error){
    errorBox.textContent =
    "Impossible d'envoyer l'e-mail.";
    return;
  }

  message.textContent =
  "E-mail de réinitialisation envoyé.";
}


/* PASSWORD RECOVERY EVENT */

supabaseClient.auth.onAuthStateChange(
(event,session)=>{

  if(event==="PASSWORD_RECOVERY"){

    document.getElementById("login").style.display="none";
    document.getElementById("dashboard").style.display="none";
    document.getElementById("resetPassword").style.display="block";

  }

});


/* SAVE NEW PASSWORD */

async function saveNewPassword(){

  const password =
  document.getElementById("newPassword").value;

  const confirm =
  document.getElementById("confirmPassword").value;

  const errorBox =
  document.getElementById("resetError");

  const message =
  document.getElementById("resetMessage");

  errorBox.textContent="";
  message.textContent="";

  if(password.length < 6){
    errorBox.textContent =
    "Le mot de passe doit contenir au moins 6 caractères.";
    return;
  }

  if(password !== confirm){
    errorBox.textContent =
    "Les deux mots de passe ne correspondent pas.";
    return;
  }

  const {error} =
  await supabaseClient.auth.updateUser({
    password:password
  });

  if(error){
    errorBox.textContent =
    "Impossible de modifier le mot de passe.";
    return;
  }

  message.textContent =
  "Mot de passe modifié avec succès.";

  setTimeout(async ()=>{

    await supabaseClient.auth.signOut();

    window.location.href=APP_URL;

  },1500);
}


/* DASHBOARD */

async function showDashboard(user){

  const {data:profile,error} =
  await supabaseClient
  .from("profiles")
  .select("full_name, role")
  .eq("id",user.id)
  .maybeSingle();

  if(error){
    console.error("Profile error:",error);
  }

  document.getElementById("login").style.display="none";
  document.getElementById("resetPassword").style.display="none";
  document.getElementById("dashboard").style.display="block";

  const welcome =
  document.getElementById("welcome");

  if(profile && profile.full_name){
    welcome.textContent =
    "Bonjour " + profile.full_name + " 👋";
  }else{
    welcome.textContent="Bonjour 👋";
  }
}


/* LOGOUT */

async function logout(){

  await supabaseClient.auth.signOut();

  document.getElementById("dashboard").style.display="none";
  document.getElementById("resetPassword").style.display="none";
  document.getElementById("login").style.display="block";

  document.getElementById("password").value="";
}


/* EXISTING SESSION */

async function checkSession(){

  const {data,error} =
  await supabaseClient.auth.getSession();

  if(error){
    console.error(error);
    return;
  }

  /*
  Do not open dashboard automatically when
  the URL is a password recovery link.
  */
  const hash = window.location.hash;

  if(data.session && !hash.includes("type=recovery")){
    await showDashboard(data.session.user);
  }
}

checkSession();

</script>

</body>
</html>
