<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>H Cleaning Services - Espace Employé</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f8fa;
      color: #16324a;
    }

    .header {
      background: linear-gradient(135deg, #08a7a7, #1677c8);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-top: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #d5dfe5;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #08a7a7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .logout {
      background: #1677c8;
    }

    .status {
      display: inline-block;
      background: #dff7ea;
      color: #158447;
      padding: 8px 13px;
      border-radius: 20px;
      font-weight: bold;
    }

    .task {
      border-left: 4px solid #08a7a7;
      padding: 12px 15px;
      margin-top: 15px;
      background: #f7fafb;
      border-radius: 8px;
    }

    .task h3 {
      margin: 0 0 8px;
    }

    .error {
      color: #c62828;
      margin-top: 12px;
    }

    #dashboard {
      display: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>H CLEANING SERVICES</h1>
    <p>Espace Employé</p>
  </div>

  <div class="container">

    <div id="login" class="card">

      <h2>Connexion</h2>

      <input
        id="email"
        type="email"
        placeholder="Adresse e-mail"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="Mot de passe"
        autocomplete="current-password"
      >

      <button id="loginButton" onclick="login()">
        Se connecter
      </button>

      <div id="error" class="error"></div>

    </div>


    <div id="dashboard">

      <div class="card">

        <h2 id="welcome">Bonjour 👋</h2>

        <p>Voici votre planning de la journée.</p>

        <span class="status">● Disponible</span>

      </div>


      <div class="card">

        <h2>Mes tâches</h2>

        <div class="task">
          <h3>Bureau Client</h3>
          <div>🕗 08:00 – 10:00</div>
          <div>📍 Verviers</div>
          <button>Voir la tâche</button>
        </div>

        <div class="task">
          <h3>Nettoyage habitation</h3>
          <div>🕚 11:00 – 13:00</div>
          <div>📍 Eupen</div>
          <button>Voir la tâche</button>
        </div>

        <button class="logout" onclick="logout()">
          Se déconnecter
        </button>

      </div>

    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://lexymobulxbkseefxxmxe.supabase.co";

    const SUPABASE_ANON_KEY =
      sb_publishable_WE_xrJP3u21brM2YKUxeEg_JpUeFuC4

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const errorBox =
        document.getElementById("error");

      const button =
        document.getElementById("loginButton");

      errorBox.textContent = "";

      if (!email || !password) {
        errorBox.textContent =
          "Veuillez entrer votre e-mail et votre mot de passe.";
        return;
      }

      button.disabled = true;
      button.textContent = "Connexion...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      button.disabled = false;
      button.textContent = "Se connecter";

      if (error) {
        console.error(error);

        errorBox.textContent =
          "Impossible de se connecter. Vérifiez votre e-mail et votre mot de passe.";

        return;
      }

      await showDashboard(data.user);
    }


    async function showDashboard(user) {

      const { data: profile, error } =
        await supabaseClient
          .from("profiles")
          .select("full_name, role")
          .eq("id", user.id)
          .maybeSingle();

      if (error) {
        console.error("Profile error:", error);
      }

      document.getElementById("login").style.display =
        "none";

      document.getElementById("dashboard").style.display =
        "block";

      const welcome =
        document.getElementById("welcome");

      if (profile && profile.full_name) {
        welcome.textContent =
          "Bonjour " + profile.full_name + " 👋";
      } else {
        welcome.textContent =
          "Bonjour 👋";
      }
    }


    async function logout() {

      await supabaseClient.auth.signOut();

      document.getElementById("dashboard").style.display =
        "none";

      document.getElementById("login").style.display =
        "block";

      document.getElementById("password").value = "";
    }


    async function checkSession() {

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        console.error("Session error:", error);
        return;
      }

      if (data.session) {
        await showDashboard(data.session.user);
      }
    }


    checkSession();

  </script>

</body>
</html>
